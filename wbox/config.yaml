# The box Longshot runs in: a headless labwc compositor, nothing on your
# desktop, the game's sound kept inside, a virtual Xbox pad as its only
# input device. Scenarios start from this and override what they need.
#
# The game: in $LONGSHOT_DIR, ~/Games/Longshot by default. In the builder's
# folder the game is bin/longshot; the folder's longshot script is a launcher
# that starts the builder again, and an AppImage cannot mount its FUSE
# filesystem inside the sandbox the virtual pad puts the app in
# (docs/containers.md). In a folder nx2/make_game.py --out wrote
# (scripts/build-longshot.sh) there is no bin/: longshot is the game itself.

name: longshot
compositor: labwc
screen: 1280x720
headless: true
input_backend: hybrid
keyboard_layout: us        # wbox injects US keycodes: the box's layout must match
audio: null                # the game's sound stays in the box

key_hold_ms: 50            # a game reads the keyboard once a frame
gamepad: xbox360           # needs /dev/uinput (scripts/setup-uinput.sh) and bwrap

timeouts:
  app_render: 15           # the game takes a while to open its window
  stop: 10

log:
  dir: ./log
screenshot_dir: ./screenshots

app:
  command: sh -c 'cd "${LONGSHOT_DIR:-$HOME/Games/Longshot}" && if [ -x bin/longshot ]; then exec ./bin/longshot; else exec ./longshot; fi'
  env:
    LONGSHOT_NO_UPDATE_CHECK: "1"
    HOS_FULLSCREEN: "1"    # the picture fills the box: no title bar, no bars
